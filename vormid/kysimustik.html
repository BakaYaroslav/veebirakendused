<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab = kometaar -->
    <table border="1">
        <tr>
            <td>
                <!-- Tekstkast -->
                <label for="nimi">Nimi: </label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Yaroslav">

            </td>
        </tr>
        <tr>
            <td>
                <label for="stiil">Vali meeldivaim muusikastiil</label>
            </td>
            <td>
                <!-- ripploend või rippmenüü (drop down list)-->
                <select name="stiil" id="stiil">
                    <option value="vali">vali..</option>
                    <option value="hiphop">hiphop</option>
                    <option value="rock">rock</option>
                    <option value="kantri">kantri</option>
                    <option value="metal">metal</option>
                    <option value="jazz">jazz</option>
                </select>
            </td>
        <tr>
        <tr>
            <td>
                <strong>kuidas sa muusikat peamiselt kuulad?</strong>
            </td>
            <td>
                <!-- radio nupud - 1 valik mitmest-->
                <br>
                <input type="radio" name="platvorm" id="spotify">
                <label for="spotify">spotify</label>
                <br>
                <input type="radio" name="platvorm" id="soundcloud">
                <label for="soundcloud">soundcloud</label>
            </td>
        <tr>
        <tr>
        <td colspan="2">
            <!-- checkbox -->
            <fieldset>
                <legend>Tee oma valikud - lemmik ansambe</legend>
                <input type="checkbox" name = "lemmikud" id="rollingstones">
                <label for="rollingstones">rollingstones</label>
                <br>
                <input type="checkbox" name = "lemmikud" id="Reimstein">
                <label for="Reimstein">Reimstein</label>
                <br>
                <input type="checkbox" name = "lemmikud" id="Imagen dragons">
                <label for="Imagen dragons">Imagen dragons</label>
                <br>
                <input type="checkbox" name = "lemmikud" id="AC-DC">
                <label for="AC-DC">AC-DC</label>

            </fieldset>
        </td>
    </tr>
    <tr>
        <td>
            <!-- range - vahemik -->
            <label for="tund">
                Mitu tundi päevas sa kuulad muuskat?
            </label>
        </td>
        <td>
            0<input type="range" id="tund" min="0" max="24">24
        </td>
    </tr>
        <tr>
            <td>  <label for="phone">Enter your phone number:</label>
               </td>
            <td> <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"  placeholder="+37212345678"></td>
        </tr>
        <tr>
            <td>

                    <label for="email">Enter your email:</label>
            </td>
            <td>
                <input type="email" id="email" name="email" placeholder="naidis@gmail.com">
            </td>
        <tr>
            <td>
                <label for="myfile">Vali oma lemmikmuusika:</label>

            </td>
            <td>
                <input type="file" id="myfile" name="myfile">
            </td>
        </tr>
            <tr>
        <td>

                <label for="favcolor">Vali värv millega sa seosed sinu lemmikmuusika</label>

        </td>
        <td>
            <input type="color" id="favcolor" name="favcolor">
        </td>
    <tr>
        <td>
            <label for="kuupaev">Millal sa eelmisel kord kuulasid muusikat?</label>

        </td>
        <td>
            <input type="date" id="kuupaev" name="kuupaev">
        </td>
    </tr>
    </tr>
        <tr>
            <td><input type="reset" value="Reset"></td>
           <td> <input type="submit" value="Submit"></td>
        </tr>

    </table>

</form>
</body>
</html>
