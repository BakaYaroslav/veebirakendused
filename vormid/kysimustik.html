<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab = kometaar -->
    <!-- Tekstkast -->
    <label for="nimi">Nimi: </label>
    <input type="text" id="nimi" placeholder="Yaroslav">
    <br>
    <!-- ripploend või rippmenüü (drop down list)-->
    <label for="stiil">Vali meeldivaim muusikastiil</label>
    <br>
    <select name="stiil" id="stiil">
        <option value="vali">vali..</option>
        <option value="hiphop">hiphop</option>
        <option value="rock">rock</option>
        <option value="kantri">kantri</option>
        <option value="metal">metal</option>
        <option value="jazz">jazz</option>
    </select>

</form>
</body>
</html>
