<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Canvas joonistamine</title>
    <link rel="stylesheet" href="canvasStyle.css">
    <script src="canvasScript.js"></script>
</head>
<body>
<h1>Joonistusrakendus Canvas + JS</h1>
<table>
    <tr>
        <td>
            <input type="button" value="puhasta" onClick="puhasta()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="joon" onClick="joon()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kolmnurk" onClick="kolmnurk()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ristkylik" onClick="ristkylik()">
            <label for="laius">Laius: </label>
            <input type="number" id="laius" min="1" max="100" step="1" onchange="ristkylik()">
            <label for="kõrgus">Kõrgus: </label>
            <input type="number" id="kõrgus" min="1" max="100" step="1" onchange="ristkylik()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ring" onClick="ring()">
            <label for="raadius">Raadius: </label>
            <input type="number" id="raadius" min="1" max="100" step="1" onchange="ring()">

        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="raatas1" onClick="raatas1()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="raatas2" onClick="raatas2()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kere1" onClick="kere1()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kere2" onClick="kere2()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="tuled" onClick="tuled()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="anteen" onClick="anteen()">
        </td>
    </tr>

</table>
<canvas id="canvas" width="400" height="400"></canvas>
</body>
</html>
