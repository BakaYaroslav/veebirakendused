<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalkulaatorid</title>
    <link rel="stylesheet" href="kalkStyle.css">
    <script src="../../js/kalk1Script.js"></script>
</head>
<body>

<h1>Kalkulaatorid</h1>
<section id="yld">
    <!-- css paigus flex row -->
    <section id="kalk1">
        <h2>Meetri/tolli kalkulaator</h2>
        <label for="arv">Sisesta arv: </label>
        <input type="number" id="arv" min="1" max="100" step="1" value="1" onchange="teisendamine()">
        <br>
        <input type="radio" name="valik" id="meeter" value="meeter" onchange="teisendamine()">
        <label for="meeter">Meeter</label>
        <br>
        <input type="radio" name="valik" id="tolli" value="tolli" onchange="teisendamine()">
        <label for="tolli">Toll</label>
        <div id="vastus"></div>
        <img src="" alt="" id="vastusepilt">

    </section>

    <section id="kalk2">
        <h2>Joogi kalkulaator</h2>

        <label for="kogus">Mitu tk soovid: </label>
        <input type="number" id="kogus" min="1" max="100" step="1" onchange="teisendamine()">
        <label for="joogivalik"> Vali lemmikjook: </label>
        <select name="joogivalik" id="joogivalik">
            <option value="">vali</option>
            <option value="kohv">Kohv</option>
            <option value="vesi">Vesi</option>
            <option value="coca">Coca-Cola</option>
            <option value="fanta">Fanta</option>
        </select>



    </section>
    <section id="kalk3">kalk3</section>
</section>

</body>
</html>
