<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
  <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<table id = "lihtne">

<tr>
  <td class="nimiA">A</td>
  <td>B</td>
</tr>
<tr>
  <td>C</td>
  <td>D</td>
</tr>
</table>

<h2>Tabel kus on ühendatud lahtrid</h2>
<table id="keeruline1">
  <tr>
    <td colspan="2" class="nimiA">A</td>

  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
  </tr>
</table>

<h2>Veel üks tabel kus on ühendatud lahtrid</h2>
<table id="keeruline2">
  <tr>
    <td rowspan="2" class="nimiA">A</td>
    <td>B</td>
  </tr>
  <tr>

    <td>D</td>
  </tr>
</table>

</body>
</html>
