<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
  <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<table id = "lihtne">

<tr>
  <td class="nimiA">A</td>
  <td>B</td>
</tr>
<tr>
  <td>C</td>
  <td>D</td>
</tr>
</table>

<h2>Tabel kus on ühendatud lahtrid</h2>
<table id="keeruline1">
  <tr>
    <td colspan="2" class="nimiA">A</td>

  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
  </tr>
</table>

<h2>Veel üks tabel kus on ühendatud lahtrid</h2>
<table id="keeruline2">
  <tr>
    <td rowspan="2" class="nimiA">A</td>
    <td>B</td>
  </tr>
  <tr>

    <td>D</td>
  </tr>
</table>


<h2>Lihtne tabel</h2>
<table id = "keeruline3">

  <tr>
    <td rowspan="5" >A</td>
    <td colspan="5">B</td>
  </tr>
  <tr>
    <td >C</td>
    <td >D</td>
    <td  colspan="2" rowspan="3">E</td>

  </tr>
  <tr>
    <td colspan="2">F</td>
  </tr>
  <tr>

    <td colspan="2" >G</td>
  </tr>
</table>


<h2>kodutöö tabel</h2>
<table id = "keeruline4">

  <tr>
    <td colspan="8">A</td>
  </tr>
  <tr>
    <td rowspan="8">B</td>
    <td colspan="6">C</td>
    <td rowspan="7">D</td>
  </tr>
  <tr>
    <td rowspan="4">E</td>
    <td colspan="4">P</td>
    <td rowspan="6">G</td>


  </tr>
  <tr>
    <td rowspan="2">N</td>

    <td colspan="2">F</td>
    <td rowspan="4">L</td>
  </tr>
  <tr>

    <td>O</td>
  </tr>
  <tr>
    <td colspan="3">M</td>

  </tr>
  <tr>

  </tr>
  <tr>
    <td colspan="5">Q</td>
  </tr>
  <tr>

    <td colspan="7">R</td>
  </tr>


</table>

</body>
</html>
